# Copy this file to config.yaml and fill in local paths.
#   cp config.example.yaml config.yaml

sqlite_path: /absolute/path/to/telegram_export.db
# Attachment file_path values are relative to this directory (files/{chat}/{msg}/...).
files_root: /absolute/path/to/tg-loader/data
# Empty = all chats. Filter by username, telegram_id, or title.
chats: []
output_dir: kb

lmstudio:
  base_url: http://127.0.0.1:1234/v1
  api_key: lm-studio
  # Empty model → first id from GET /v1/models
  model: ""
  # Seconds to wait for one completion. 0 = no read timeout.
  # Default OpenAI SDK is 600s and retries twice — that starts a second
  # generation if a local/LM Link model is still answering.
  timeout_sec: 3600
  max_retries: 0

deepseek:
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  model: deepseek-flash
  timeout_sec: 600
  max_retries: 0
  # Hard ceiling (Flash default is 384k). Actual request is ~1.4× draft.
  max_tokens: 131072

# Truncate a single message body before sending it to an LLM.
max_message_chars: 6000
# Max tokens (cl100k_base) of the message payload in one pipeline pass.
max_batch_tokens: 120000

agents:
  structure:
    backend: deepseek
    model: deepseek-flash
  generator:
    backend: deepseek
    model: deepseek-flash
  critic:
    backend: deepseek
    model: deepseek-flash
  polisher:
    backend: deepseek
    model: deepseek-flash
  merge:
    backend: deepseek
    model: deepseek-flash
  split:
    backend: deepseek
    model: deepseek-flash
  reparent:
    backend: deepseek
    model: deepseek-flash
  tag:
    backend: deepseek
    model: deepseek-flash

# Пороги куратора (kb-pipeline curate). Можно не указывать — есть значения по умолчанию.
# curate:
#   merge_max_messages: 5
#   merge_target_max: 80
